services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: banking_application
      POSTGRES_USER: banking_demo
      POSTGRES_PASSWORD: ${BANKING_DB_PASSWORD:?Set BANKING_DB_PASSWORD before starting Compose}
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_demo -d banking_application"]
      interval: 5s
      timeout: 3s
      retries: 10
